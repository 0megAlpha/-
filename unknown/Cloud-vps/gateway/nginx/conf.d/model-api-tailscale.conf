# Private model API access over the existing Tailscale network only.
# The llama-server processes remain bound to 127.0.0.1; no public listener is added.
server {
    listen 100.x.x.x:18088;
    server_name _;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
server {
    listen 100.x.x.x:18089;
    server_name _;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
