<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>AI Company — Mobile Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['-apple-system','PingFang TC','Noto Sans TC','sans-serif'] } } } }
</script>
<style>
  body { background: radial-gradient(1200px 600px at 80% -10%, #1e3a5f 0%, #0f172a 45%, #020617 100%); }
  .glass { background: rgba(15,23,42,.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(148,163,184,.14); }
  .dot-up { background:#34d399; box-shadow:0 0 8px #34d399; }
  .dot-down { background:#f87171; box-shadow:0 0 8px #f87171; }
  .dot-timeout { background:#fbbf24; box-shadow:0 0 8px #fbbf24; }
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background:#334155; border-radius:4px; }
  @keyframes pulse-soft { 0%,100%{opacity:1} 50%{opacity:.45} }
  .thinking { animation: pulse-soft 1.2s ease-in-out infinite; }
  .safe-area { padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>
<body class="text-slate-200 font-sans min-h-screen">

<header class="sticky top-0 z-30 glass border-x-0 border-t-0">
  <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
    <div>
      <h1 class="text-lg font-bold tracking-wide text-white">🤖 AI Company</h1>
      <p class="text-[11px] text-slate-400">Mobile Command Center</p>
    </div>
    <div class="text-right">
      <div id="clock" class="text-sm font-semibold text-cyan-300 tabular-nums"></div>
      <div id="queueCount" class="text-[11px] text-slate-400">佇列 0</div>
    </div>
  </div>
</header>

<main class="max-w-md mx-auto px-4 pt-4 pb-10 safe-area space-y-4">

  <!-- 服務狀態 -->
  <section>
    <h2 class="text-xs uppercase tracking-widest text-slate-500 mb-2">System Health</h2>
    <div id="services" class="grid grid-cols-2 gap-2"></div>
  </section>

  <!-- 輪流呼叫對話框 -->
  <section class="glass rounded-2xl p-4">
    <h2 class="text-xs uppercase tracking-widest text-slate-500 mb-3">Round-Robin Agent Call</h2>
    <div id="agents" class="flex flex-wrap gap-2 mb-3"></div>
    <textarea id="task" rows="3" placeholder="輸入任務，交給多 agent 輪流執行..."
      class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl p-3 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 resize-none"></textarea>
    <button id="sendBtn" class="mt-3 w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 active:scale-[.98] transition text-white font-semibold py-3 rounded-xl shadow-lg shadow-cyan-900/40">
      🚀 派發任務
    </button>
    <div id="reply" class="hidden mt-4">
      <div class="flex items-center gap-2 text-[11px] text-slate-400 mb-1">
        <span id="replyBadge" class="px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300"></span>
        <span id="replyModel" class="px-2 py-0.5 rounded-full bg-slate-700/60"></span>
      </div>
      <pre id="replyText" class="whitespace-pre-wrap text-[13px] leading-relaxed bg-slate-900/60 border border-slate-700/40 rounded-xl p-3 max-h-72 overflow-y-auto"></pre>
    </div>
  </section>

  <!-- Agent 入口 -->
  <section>
    <h2 class="text-xs uppercase tracking-widest text-slate-500 mb-2">Agent Launcher</h2>
    <div id="launcher" class="grid grid-cols-2 gap-2"></div>
  </section>

  <footer class="text-center text-[11px] text-slate-600 pt-2">
    AI Agent Fleet · LiteLLM Gateway · 部署於 VPS 本機 · 不推送 GitHub
  </footer>
</main>

<script>
const API = location.protocol === 'https:' ? `${location.protocol}//${location.host}/api` : 'http://127.0.0.1:8090/api';
const AGENTS = [
  { id:'openhands', label:'OpenHands', color:'border-cyan-500/50 text-cyan-300' },
  { id:'devin-sim', label:'Devin 2.2 sim', color:'border-violet-500/50 text-violet-300' },
  { id:'claude-code', label:'Claude Code', color:'border-orange-500/50 text-orange-300' },
  { id:'cline', label:'Cline', color:'border-emerald-500/50 text-emerald-300' },
];
const LAUNCHERS = [
  { name:'OpenHands', url:'http://'+location.hostname+':18000', desc:'畫布介面' },
  { name:'OpenCode', url:'http://'+location.hostname+':4096', desc:'Terminal Web' },
  { name:'n8n', url:'http://'+location.hostname+':5678', desc:'排程' },
  { name:'Neo4j', url:'http://'+location.hostname+':7474', desc:'圖形記憶' },
  { name:'SonarQube', url:'http://'+location.hostname+':9000', desc:'程式品質' },
  { name:'Dashboard', url:'http://'+location.hostname+':8080', desc:'ENI Gateway' },
];

let selectedAgent = 'auto';
const svcEl = document.getElementById('services');
const agentsEl = document.getElementById('agents');
const launcherEl = document.getElementById('launcher');
const taskEl = document.getElementById('task');
const replyBox = document.getElementById('reply');
const replyBadge = document.getElementById('replyBadge');
const replyModel = document.getElementById('replyModel');
const replyText = document.getElementById('replyText');
const sendBtn = document.getElementById('sendBtn');

function clock(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-TW',{hour12:false}); }
setInterval(clock, 1000); clock();

function renderServices(list){
  svcEl.innerHTML = list.map(s => `
    <div class="glass rounded-xl px-3 py-2.5 flex items-center gap-2">
      <span class="dot-${s.status} w-2 h-2 rounded-full shrink-0"></span>
      <div class="min-w-0">
        <p class="text-[13px] font-medium truncate">${s.name}</p>
        <p class="text-[10px] text-slate-500">:${s.port} · ${s.status}</p>
      </div>
    </div>`).join('');
}
async function refresh(){
  try {
    const r = await fetch(`${API}/status`);
    const j = await r.json();
    renderServices(j.services || []);
    document.getElementById('queueCount').textContent = `佇列 ${j.queue ?? 0}`;
  } catch { svcEl.innerHTML = '<p class="text-xs text-rose-400 col-span-2">後端不可達 (server.mjs)</p>'; }
}
refresh(); setInterval(refresh, 15000);

agentsEl.innerHTML = AGENTS.map(a => `
  <button data-agent="${a.id}" class="agent-chip px-3 py-1.5 rounded-full text-[12px] border ${a.color} bg-slate-900/40 active:scale-95 transition">${a.label}</button>
`).join('') + `
  <button data-agent="auto" class="agent-chip px-3 py-1.5 rounded-full text-[12px] border border-slate-600 text-slate-300 bg-slate-800/60 active:scale-95 transition selected">auto 輪播</button>`;

document.querySelectorAll('.agent-chip').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.agent-chip').forEach(x => { x.classList.remove('selected'); x.classList.add('opacity-60'); });
  b.classList.add('selected'); b.classList.remove('opacity-60');
  selectedAgent = b.dataset.agent;
}));

launcherEl.innerHTML = LAUNCHERS.map(l => `
  <a href="${l.url}" target="_blank" class="glass rounded-xl px-3 py-3 hover:bg-slate-800/60 active:scale-[.98] transition block">
    <p class="text-[13px] font-semibold text-white">${l.name}</p>
    <p class="text-[10px] text-slate-500">${l.desc}</p>
  </a>`).join('');

sendBtn.addEventListener('click', async () => {
  const task = taskEl.value.trim();
  if (!task) return taskEl.focus();
  sendBtn.disabled = true;
  sendBtn.classList.add('opacity-60');
  sendBtn.innerHTML = '<span class="thinking">⏳ 執行中…</span>';
  replyBox.classList.remove('hidden');
  replyBadge.textContent = selectedAgent;
  replyModel.textContent = '…';
  replyText.textContent = '模型閘道處理中，請稍候…';
  try {
    const r = await fetch(`${API}/chat`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ agent: selectedAgent, task })
    });
    const j = await r.json();
    replyBadge.textContent = `${j.agent} / ${j.ok ? 'done' : 'error'}`;
    replyModel.textContent = j.model || 'n/a';
    replyText.textContent = j.reply || j.error || '(no reply)';
  } catch (e) {
    replyBadge.textContent = 'network';
    replyText.textContent = String(e);
  }
  sendBtn.disabled = false;
  sendBtn.classList.remove('opacity-60');
  sendBtn.innerHTML = '🚀 派發任務';
});
</script>
</body>
</html>
