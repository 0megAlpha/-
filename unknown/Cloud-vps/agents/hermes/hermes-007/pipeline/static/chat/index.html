<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hermes 對話</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0b0f14;color:#e6edf3;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #1c2128;background:#0d1117}header a{color:#8b949e;font-size:12px;text-decoration:none}select{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:10px;padding:8px;font-size:13px;flex:1}main{flex:1;overflow-y:auto;padding:12px}.msg{max-width:85%;padding:10px 14px;border-radius:16px;margin:6px 0;font-size:14px;white-space:pre-wrap}.msg.user{background:#2ee6a6;color:#04140e;margin-left:auto}.msg.assistant{background:#161b22;border:1px solid #30363d}.msg .tag{display:block;font-size:10px;opacity:0.6;margin-bottom:3px}footer{display:flex;gap:8px;padding:10px;border-top:1px solid #1c2128;background:#0d1117}input[type=text]{flex:1;padding:12px;border-radius:12px;border:1px solid #30363d;background:#161b22;color:#e6edf3}button{background:#2ee6a6;color:#04140e;border:none;border-radius:12px;padding:0 18px;font-weight:700}</style></head><body><header><a href="/">← 流水線</a><select id="modelSelect"><option>載入中...</option></select></header><main id="pane"></main><footer><input type="text" id="input" placeholder="輸入訊息..."><button id="send">送出</button></footer><script>const SID=localStorage.getItem('hermes_chat_session')||(()=>{const s='chat_'+Date.now();localStorage.setItem('hermes_chat_session',s);return s;})();async function loadModels(){const res=await fetch('/api/chat/models');const sel=document.getElementById('modelSelect');if(!res.ok){sel.innerHTML='<option>無法連線</option>';return}const data=await res.json();sel.innerHTML=data.models.map(m=>`<option value="${m}">${m}${m.includes('ollama')||m.includes('qwen')||m.includes('deepseek')?' [本地]':' [雲端]'}</option>`).join('')}async function loadHistory(){const res=await fetch(`/api/chat/history?session_id=${SID}`);const hist=await res.json();const pane=document.getElementById('pane');pane.innerHTML='';hist.forEach(m=>append(m.role,m.content,m.model))}function append(role,content,model){const pane=document.getElementById('pane');const div=document.createElement('div');div.className=`msg ${role}`;div.innerHTML=(role==='assistant'&&model?`<span class="tag">${model}</span>`:'')+content;pane.appendChild(div);pane.scrollTop=pane.scrollHeight}async function send(){const input=document.getElementById('input');const text=input.value.trim();const model=document.getElementById('modelSelect').value;if(!text||!model)return;input.value='';append('user',text);const pl=document.createElement('div');pl.className='msg assistant';pl.textContent='...';document.getElementById('pane').appendChild(pl);const res=await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:SID,model,message:text})});const data=await res.json();pl.innerHTML=res.ok?`<span class="tag">${model}</span>${data.reply}`:`錯誤: ${data.detail}`}document.getElementById('send').addEventListener('click',send);document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});loadModels();loadHistory();</script></body></html>
