name: Agent Catalog Integrity

on:
  push:
    paths:
      - ".agents/**"
      - "extensions/plugins/**"
      - "scripts/sync-agent-catalog.py"
      - "tests/test-sync-agent-catalog.sh"
      - ".github/workflows/agent-catalog-integrity.yml"
  pull_request:
    paths:
      - ".agents/**"
      - "extensions/plugins/**"
      - "scripts/sync-agent-catalog.py"
      - "tests/test-sync-agent-catalog.sh"
      - ".github/workflows/agent-catalog-integrity.yml"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify local registry is in sync
        run: python scripts/sync-agent-catalog.py

      - name: Validate repair behavior test
        run: bash tests/test-sync-agent-catalog.sh
