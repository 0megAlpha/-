services:
  grafana:
    image: grafana/grafana:latest
    restart: always
    environment: [GF_SECURITY_ADMIN_USER=admin, GF_SECURITY_ADMIN_PASSWORD=QRoFBdPYTrHyEMISd2Mv]
    volumes: [grafana-data:/var/lib/grafana]
    ports: ["127.0.0.1:3010:3000"]
  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
  loki:
    image: grafana/loki:latest
    restart: always
    volumes: ["./loki/loki-config.yml:/etc/loki/local-config.yaml", "loki-data:/loki"]
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["127.0.0.1:3100:3100"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    volumes: ["./otel/otel-collector-config.yml:/etc/otel-collector-config.yaml"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "127.0.0.1:8889:8889"]
  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: always
    environment: ["COLLECTOR_OTLP_ENABLED=true"]
    ports: ["127.0.0.1:16686:16686"]
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: always
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker/:/var/lib/docker:ro"]

  node_exporter:
    image: prom/node-exporter:latest
    restart: always
    ports: ["127.0.0.1:9100:9100"]
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    restart: always
    volumes: [uptime-kuma-data:/app/data]
    ports: ["127.0.0.1:3001:3001"]
volumes: {grafana-data: {}, prometheus-data: {}, loki-data: {}, uptime-kuma-data: {}}
