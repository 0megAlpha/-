schema: agent-stack.registry.v1
primary_platform:
  name: OpenHands
  path: openhands
  capabilities:
    - model-routing: LiteLLM
    - tools: MCP
    - agent-interoperability: ACP
    - skills: openhands/extensions/skills
    - adjudication: openhands/extensions/skills/emat-agent-court
agents:
  - {name: claude-code, path: claude-code, provider_adapter: claude-code/providers, protocol: anthropic-messages, status: config-template}
  - {name: codex, path: codex, provider_adapter: codex/providers, protocol: openai-responses, status: config-template}
  - {name: devin, path: devin, provider_adapter: devin/providers, protocol: devin-service-api-and-mcp, status: service-api-only}
  - {name: hermes, path: hermes, provider_adapter: hermes/providers, protocol: native-provider-registry-plus-openai-compatible, status: existing-provider-implementation}
  - {name: dsh, path: dsh, provider_adapter: dsh/providers, protocol: openai-compatible-or-native, status: config-template}
  - {name: aider, path: aider, provider_adapter: aider/providers, protocol: openai-chat-completions, status: config-template}
  - {name: cline, path: cline, provider_adapter: cline/providers, protocol: openai-chat-completions, status: config-template}
  - {name: goose, path: goose, provider_adapter: goose/providers, protocol: openai-chat-completions, status: config-template}
  - {name: opencode, path: opencode, provider_adapter: opencode/providers, protocol: openai-chat-completions, status: config-template}
  - {name: deepseek, path: deepseek, provider_adapter: deepseek/providers, protocol: deepseek-native-or-openai-compatible, status: config-template}
  - {name: openwebui, path: openwebui, provider_adapter: openwebui/providers, protocol: openai-chat-completions, status: config-template}
  - {name: mini-swe-agent, path: agents/mini-swe-agent, provider_adapter: agents/mini-swe-agent/providers, protocol: litellm-openai-compatible-and-native-providers, status: config-template}
  - {name: swe-agent, path: agents/SWE-agent, provider_adapter: agents/SWE-agent/providers, protocol: litellm-api-base-and-api-key, status: config-template}
  - {name: dgm, path: agents/DGM, provider_adapter: agents/DGM/providers, protocol: openai-sdk-anthropic-sdk-deepseek-openrouter, status: config-template}
  - {name: hyperagents, path: agents/HyperAgents, provider_adapter: agents/HyperAgents/providers, protocol: litellm, status: config-template}
  - {name: fuzzingbrain, path: agents/DARPA-AIxCC, provider_adapter: agents/DARPA-AIxCC/providers, protocol: litellm-openai-anthropic-google-xai, status: config-template}
  - {name: agent-system, path: agents/agent-system, provider_adapter: agents/agent-system/providers, protocol: openai-chat-completions, status: config-template}

provider_adapter_status:
  claude-code:
    path: claude-code/providers
    protocol: anthropic-messages
    status: template-installed
    live_test: pending
    blocker: LiteLLM Anthropic Messages route timed out; provider credential not validated
  codex:
    path: codex/providers
    protocol: openai-responses
    status: template-installed
    live_test: failed
    blocker: LiteLLM /v1/responses returned HTTP 500
  devin:
    path: devin/providers
    protocol: devin-service-api-and-mcp
    status: template-installed
    live_test: pending
    blocker: Devin API credential not available
  hermes:
    path: hermes/providers
    protocol: native-provider-registry-plus-openai-chat-completions
    status: existing-adapter-plus-template
    live_test: pending
  dsh:
    path: dsh/providers
    protocol: openai-chat-completions
    status: template-installed
    live_test: pending
  aider:
    path: aider/providers
    protocol: openai-chat-completions
    status: template-installed
    live_test: pending
  cline:
    path: cline/providers
    protocol: openai-chat-completions
    status: template-installed
    live_test: pending
  goose:
    path: goose/providers
    protocol: openai-chat-completions
    status: template-installed
    live_test: pending
  opencode:
    path: opencode/providers
    protocol: openai-chat-completions
    status: template-installed
    live_test: pending
  deepseek:
    path: deepseek/providers
    protocol: openai-chat-completions
    status: template-installed
    live_test: pending
  openwebui:
    path: openwebui/providers
    protocol: openai-chat-completions
    status: template-installed
    live_test: pending
  openhands:
    path: openhands/providers
    protocol: openai-chat-completions
    status: template-installed
    live_test: local-qwen3-0.6b-chat-completions-pass
  mini-swe-agent:
    path: agents/mini-swe-agent/providers
    protocol: litellm-openai-compatible
    status: template-installed
    live_test: pending
    blocker: LiteLLM master key placeholder
  swe-agent:
    path: agents/SWE-agent/providers
    protocol: litellm-api-base
    status: template-installed
    live_test: pending
    blocker: LiteLLM master key placeholder
  dgm:
    path: agents/DGM/providers
    protocol: openai-sdk-compatible
    status: template-installed
    live_test: pending
  hyperagents:
    path: agents/HyperAgents/providers
    protocol: litellm
    status: template-installed
    live_test: pending
  fuzzingbrain:
    path: agents/DARPA-AIxCC/providers
    protocol: litellm-native-providers
    status: template-installed
    live_test: pending
    blocker: custom api_base not exposed in current LLMConfig schema
  agent-system:
    path: agents/agent-system/providers
    protocol: openai-chat-completions
    status: template-installed
    live_test: pending
    blocker: LiteLLM master key placeholder
