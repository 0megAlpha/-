version: '3.8'
services:
  hermes:
    image: nousresearch/hermes:latest
    container_name: hermes-ultimate-2026
    ports:
    - 8787:8787
    volumes:
    - ./config:/app/config
    - ./plugins:/app/plugins
    - ./skills:/app/skills
    - ./memory:/app/memory
    - ./logs:/app/logs
    environment:
      HERMES_MODE: browser
      HERMES_PORT: '8787'
      HERMES_HOST: 0.0.0.0
      MEMORY_ENABLED: 'true'
      PLUGIN_AUTO_LOAD: 'true'
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8787/health
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
    - openhands
  openhands:
    image: ghcr.io/all-hands-ai/openhands:latest
    container_name: openhands-sandbox
    ports:
    - 3000:3000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ../openhands-ultimate/workspace:/opt/workspace
    environment:
      SANDBOX_USER_ID: '1000'
    restart: unless-stopped
networks:
  default:
    name: hermes-ultimate
