<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hermes-007 Pipeline</title><link rel="manifest" href="/manifest.json"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,sans-serif;background:#0b0f14;color:#e6edf3;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header{padding:10px 12px;border-bottom:1px solid #1c2128;background:#0d1117}header h1{font-size:15px;margin:0;color:#ff9d2e}.switcher{display:flex;gap:8px;font-size:12px;margin-top:4px}.switcher a{color:#8b949e;text-decoration:none;padding:4px 10px;border:1px solid #30363d;border-radius:8px}.switcher a.active{color:#ff9d2e;border-color:#ff9d2e}main{flex:1;overflow-y:auto;padding:12px}textarea{width:100%;min-height:70px;background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:12px;padding:10px;font-size:14px}button{background:#ff9d2e;color:#1a0f00;border:none;border-radius:12px;padding:10px 18px;font-weight:700;margin-top:8px}.run-list{margin-top:16px}.run-item{padding:10px;border:1px solid #30363d;border-radius:10px;margin-bottom:8px;cursor:pointer}.run-item .status{float:right;font-size:11px;padding:2px 8px;border-radius:8px}.status.running{background:#3a2e00;color:#ff9d2e}.status.completed{background:#0d3321;color:#2ee6a6}.status.queued{background:#1c2128;color:#8b949e}.log-line{font-size:12px;font-family:monospace;padding:4px 0;border-bottom:1px solid #1c2128;color:#8b949e}.artifact-chip{display:inline-block;font-size:11px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:3px 8px;margin:3px;color:#2ee6a6;cursor:pointer}pre{white-space:pre-wrap;background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px;font-size:12px}</style></head><body><header><h1>🦾 Hermes-007 Pipeline</h1><div class="switcher"><a class="active" href="#">本系統：自動鏈式流水線</a><a href="http://46.250.254.189:8088">Google-AI：20-Agent 對話台</a></div></header><main><textarea id="reqInput" placeholder="輸入一句話需求，例如：我要一個 AI 客服系統，具備多語言、自動回覆、後台管理"></textarea><button id="startBtn">🚀 啟動完整流水線</button><div class="run-list" id="runList"></div><div id="detail"></div></main><script>const API='';let currentRunId=null;let pollTimer=null;async function startRun(){const req=document.getElementById('reqInput').value.trim();if(!req)return;const res=await fetch(API+'/api/pipeline/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requirement:req})});const data=await res.json();currentRunId=data.run_id;loadRuns();pollStatus()}async function loadRuns(){const res=await fetch(API+'/api/pipeline/runs');const runs=await res.json();document.getElementById('runList').innerHTML=runs.map(r=>`<div class="run-item" onclick="viewRun('${r.run_id}')">${r.requirement.slice(0,40)}...<span class="status ${r.status.split(':')[0]}">${r.status}</span></div>`).join('')}function viewRun(id){currentRunId=id;pollStatus()}async function pollStatus(){if(pollTimer)clearInterval(pollTimer);const render=async()=>{if(!currentRunId)return;const res=await fetch(API+`/api/pipeline/status/${currentRunId}`);if(!res.ok)return;const s=await res.json();const d=document.getElementById('detail');d.innerHTML=`<h3 style="color:#ff9d2e">執行紀錄 (迭代第 ${s.iteration} 輪) — ${s.status}</h3>${s.log.map(l=>`<div class="log-line">${l}</div>`).join('')}<h4>已完成產出（點擊查看）</h4>${s.artifact_keys.map(k=>`<span class="artifact-chip" onclick="viewArtifact('${s.run_id}','${k}')">${k}</span>`).join('')}<div id="artifactView"></div>`;if(s.status==='completed'||s.status.startsWith('error')){clearInterval(pollTimer);loadRuns()}};await render();pollTimer=setInterval(render,3000)}async function viewArtifact(runId,aid){const res=await fetch(API+`/api/pipeline/artifact/${runId}/${aid}`);const data=await res.json();document.getElementById('artifactView').innerHTML=`<h4>${data.filename}</h4><pre>${data.content.replace(/</g,'&lt;')}</pre>`}document.getElementById('startBtn').addEventListener('click',startRun);loadRuns();</script></body></html>
