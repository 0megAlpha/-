name: oh-my-agent tests

on:
  push:
    branches: [main]
    paths:
      - "extensions/plugins/oh-my-agent/**"
      - "tests/test_oh_my_agent.py"
      - ".github/workflows/oh-my-agent-tests.yml"
  pull_request:
    paths:
      - "extensions/plugins/oh-my-agent/**"
      - "tests/test_oh-my-agent.py"
      - ".github/workflows/oh-my-agent-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile plugin and tests
        run: python -m compileall -q extensions/plugins/oh-my-agent/oh_my_agent tests
      - name: Run oh-my-agent unit tests
        run: python -m unittest discover -s tests -p 'test_oh_my_agent.py' -v
      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            # New branch: inspect the complete initial tree against the empty tree.
            git diff --check "$(git hash-object -t tree /dev/null)" "${{ github.sha }}"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            # Compare the full pushed range, not merely the final commit.
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            echo "::error::Cannot resolve push event's before SHA; refusing to skip whitespace validation."
            exit 1
          fi
