# Generated by acp-extension-dsh 0.2.0 for DeepSeek Harness 0.1.5-rc.2.
# API credentials stay in the host environment; never inline them here.

# The ACP host owns no telemetry or product inventory rows.
- id: session-telemetry-otel
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-log-deepseek
  disabled: true

# Keep sessions and the exact-read query index on Lody's own roots.
- id: session-persistence-jsonl
  config:
    root: !!js process.env.ACP_EXTENSION_DSH_SESSION_ROOT
    compression: zstd

- id: session-query-sqlite
  config:
    path: !!js process.env.ACP_EXTENSION_DSH_QUERY_PATH
    openAt: never

# The agent factory default for any preset-created child.
- id: agent-default-model
  config:
    provider: "deepseek-official"
    model: "deepseek-flash"

# Dormant until llm-pi-ai.providers in settings.yaml declares a route. The
# upstream adapter owns profile validation, route lifecycle, and credentials.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  inject: [settings]
  config:
    providers: {}

# Preserve the product's three permission modes with client-facing labels.
- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: Read-only
        description: Read inside the workspace; protected writes require one-time approval.
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: Workspace write
        description: Read and write inside the workspace; wider access requires one-time approval.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: Full access
        description: Allow unrestricted file and command access without approval prompts.

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
        includeShippedRoot: false
        includeUserRoot: true
        roots:
          - path: "/usr/local/lib/node_modules/lody/dist/deepseek-agent-presets"
            trust: system

    # The shipped presets' delegation group resolves this host-scope opt-in.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: acp-agent
      name: "file:///usr/local/lib/node_modules/lody/dist/deepseek-acp.js"
      inject: [settings]
      config:
        provider: "deepseek-official"
        model: "deepseek-flash"
        reasoningEffort: "max"
