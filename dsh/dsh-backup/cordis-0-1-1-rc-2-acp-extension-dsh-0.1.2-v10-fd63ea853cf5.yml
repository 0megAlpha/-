# Generated for acp-extension-dsh. API credentials stay in the host environment.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: ''

- id: session-persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.ACP_EXTENSION_DSH_SESSION_ROOT
    compression: zstd

- id: session-checkpoint
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: session-query
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js process.env.ACP_EXTENSION_DSH_QUERY_PATH
    openAt: never

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000

- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: permission-presets
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: Read-only
        description: Read inside the workspace; protected writes require one-time approval.
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: Workspace write
        description: Read and write inside the workspace; wider access requires one-time approval.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: Full access
        description: Allow unrestricted file and command access without approval prompts.

# Host-plane services shared by every per-session preset.
- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: commands
  name: '@deepseek-ai/dsh-commands'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: goal
  name: '@deepseek-ai/dsh-goal'

- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: code-runtime
  name: '@deepseek-ai/dsh-code-runtime-worker-thread'

- id: cordis-host-runner
  name: '@deepseek-ai/dsh-cordis-host-runner'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# The shipped root supplies the four official modes. AgentPresets also appends
# $DSH_HOME/.agent-presets so user-authored DSH compositions remain available.
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: standard
    roots:
      - path: "/usr/local/lib/node_modules/lody/dist/deepseek-agent-presets"
        trust: system

- id: acp-agent
  name: "file:///usr/local/lib/node_modules/lody/dist/deepseek-acp.js"
  inject: [settings]
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    reasoningEffort: max
