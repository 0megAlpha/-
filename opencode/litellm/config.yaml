model_list:
  - model_name: "pollinations-free"
    litellm_params:
      model: "openai/openai"
      api_base: "https://text.pollinations.ai/openai"
      api_key: "not-needed"

  - model_name: "kilo-free"
    litellm_params:
      model: "openai/openrouter/free"
      api_base: "https://api.kilo.ai/api/gateway"
      api_key: "not-needed"

  - model_name: "llm7-free"
    litellm_params:
      model: "openai/gpt-4o-mini"
      api_base: "https://api.llm7.io/v1"
      api_key: "${LLM7_API_KEY:-not-needed}"

  - model_name: "refuseless-glm53-uncensored"
    litellm_params:
      model: "refuseless/glm-5.3-abliterated"
      api_key: "${REFUSELESS_API_KEY:-}"

  - model_name: "abliteration-glm53-uncensored"
    litellm_params:
      model: "abliteration/abliterated-model-large-v2"
      api_key: "${ABLITERATION_API_KEY:-}"

  - model_name: "groq-llama"
    litellm_params:
      model: "groq/llama-3.3-70b-versatile"
      api_key: "${GROQ_API_KEY:-}"

  - model_name: "gemini-flash"
    litellm_params:
      model: "gemini/gemini-2.5-flash"
      api_key: "${GEMINI_API_KEY:-}"

  - model_name: "zai-glm-flash"
    litellm_params:
      model: "zai/glm-4.5-flash"
      api_key: "${ZAI_API_KEY:-}"

  - model_name: "cerebras-llama"
    litellm_params:
      model: "cerebras/llama3.3-70b"
      api_key: "${CEREBRAS_API_KEY:-}"

  - model_name: "openrouter-free"
    litellm_params:
      model: "openrouter/openrouter/free"
      api_key: "${OPENROUTER_API_KEY:-}"

  - model_name: "deepseek-chat"
    litellm_params:
      model: "deepseek/deepseek-chat"
      api_key: "${DEEPSEEK_API_KEY:-}"

  - model_name: "qwen-plus"
    litellm_params:
      model: "dashscope/qwen-plus"
      api_key: "${DASHSCOPE_API_KEY:-}"

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 180

router_settings:
  routing_strategy: "simple-shuffle"
  allowed_fails: 2
  cooldown_time: 30
  fallbacks:
    - pollinations-free: ["kilo-free", "llm7-free"]
    - kilo-free: ["pollinations-free", "llm7-free"]
    - refuseless-glm53-uncensored: ["abliteration-glm53-uncensored", "kilo-free"]
    - deepseek-chat: ["pollinations-free", "kilo-free"]
    - qwen-plus: ["pollinations-free", "kilo-free"]

general_settings:
  disable_auth: true
  store_model_in_db: false
  allow_requests_on_db_unavailable: true
