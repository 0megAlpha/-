model_list:

  # ============================================================
  # 零 Key 免费层（无需注册，直接可用）
  # ============================================================

  # Pollinations：完全 keyless，OpenAI 兼容端点
  - model_name: "pollinations-free"
    litellm_params:
      model: "openai/openai"
      api_base: "https://text.pollinations.ai/openai"
      api_key: "not-needed"

  # Kilo Gateway：匿名可访问免费模型，每 IP 200 次/小时
  # 免费模型包含 z-ai/glm-5:free
  - model_name: "kilo-glm-5-free"
    litellm_params:
      model: "openai/z-ai/glm-5:free"
      api_base: "https://api.kilo.ai/api/openrouter"
      api_key: "not-needed"

  - model_name: "kilo-minimax-free"
    litellm_params:
      model: "openai/minimax/minimax-m2.1:free"
      api_base: "https://api.kilo.ai/api/openrouter"
      api_key: "not-needed"

  # ============================================================
  # 免费但需注册（无审查 GLM 5.3 的真正免费入口）
  # ============================================================

  # Abliteration.ai：GLM-5.3 衍生的无审查模型
  # 注册后送 1 credit 免费预览，无需信用卡
  # 模型 ID：abliterated-model-large-v2（基于 GLM-5.3）
  - model_name: "abliteration-glm53-uncensored"
    litellm_params:
      model: "openai/abliterated-model-large-v2"
      api_base: "https://api.abliteration.ai/v1"
      api_key: "${ABLITERATION_AI_API_KEY:-}"

  # ============================================================
  # 免费层（需免费注册，但无付费）
  # ============================================================

  - model_name: "groq-llama"
    litellm_params:
      model: "groq/llama-3.3-70b-versatile"
      api_key: "${GROQ_API_KEY:-}"

  - model_name: "gemini-flash"
    litellm_params:
      model: "gemini/gemini-2.5-flash"
      api_key: "${GEMINI_API_KEY:-}"

  - model_name: "zai-glm-flash"
    litellm_params:
      model: "zai/glm-4.5-flash"
      api_key: "${ZAI_API_KEY:-}"

  - model_name: "cerebras-llama"
    litellm_params:
      model: "cerebras/llama3.3-70b"
      api_key: "${CEREBRAS_API_KEY:-}"

  # ============================================================
  # 主力付费层（Key 留空则自动跳过）
  # ============================================================

  - model_name: "deepseek-chat"
    litellm_params:
      model: "deepseek/deepseek-chat"
      api_key: "${DEEPSEEK_API_KEY:-}"

  - model_name: "zai-glm-5.3"
    litellm_params:
      model: "zai/glm-5.3"
      api_key: "${ZAI_API_KEY:-}"

  - model_name: "qwen-plus"
    litellm_params:
      model: "dashscope/qwen-plus"
      api_key: "${DASHSCOPE_API_KEY:-}"

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 180

router_settings:
  routing_strategy: "simple-shuffle"
  allowed_fails: 2
  cooldown_time: 30
  fallbacks:
    - pollinations-free: ["kilo-glm-5-free", "kilo-minimax-free"]
    - kilo-glm-5-free: ["pollinations-free", "kilo-minimax-free"]
    - abliteration-glm53-uncensored: ["kilo-glm-5-free", "pollinations-free"]
    - groq-llama: ["pollinations-free", "kilo-glm-5-free"]
    - gemini-flash: ["groq-llama", "pollinations-free"]

general_settings:
  master_key: "${LITELLM_MASTER_KEY:-sk-local-dev-key}"
  disable_spend_logs: true
