model_list:
  # ═══ 官方 API（主力，用户已明确对接）═══
  - model_name: "deepseek-v4-flash"
    litellm_params: {model: deepseek/deepseek-v4-flash, api_key: "<DEEPSEEK_API_KEY>", api_base: "https://api.deepseek.com"}
  - model_name: "deepseek-reasoner"
    litellm_params: {model: deepseek/deepseek-reasoner, api_key: "<DEEPSEEK_API_KEY>", api_base: "https://api.deepseek.com"}

  - model_name: "glm-5.2"
    litellm_params: {model: openai/glm-5.2, api_key: "<ZHIPU_API_KEY>", api_base: "https://open.bigmodel.cn/api/paas/v4"}
  - model_name: "glm-4.7"
    litellm_params: {model: openai/glm-4.7, api_key: "<ZHIPU_API_KEY>", api_base: "https://open.bigmodel.cn/api/paas/v4"}

  - model_name: "qwen-plus"
    litellm_params: {model: openai/qwen-plus, api_key: "<DASHSCOPE_API_KEY>", api_base: "https://<DASHSCOPE_WORKSPACE_ID>.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"}
  - model_name: "qwen-coder"
    litellm_params: {model: openai/qwen-coder-plus, api_key: "<DASHSCOPE_API_KEY>", api_base: "https://<DASHSCOPE_WORKSPACE_ID>.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"}

  # ═══ 免费路由（OpenRouter :free，下拉即可切换）═══
  - model_name: "free-qwen3.8-27b"
    litellm_params: {model: openrouter/qwen/qwen3.8-27b:free, api_key: "<OPENROUTER_API_KEY>"}
  - model_name: "free-glm-5.2"
    litellm_params: {model: openrouter/z-ai/glm-5.2:free, api_key: "<OPENROUTER_API_KEY>"}
  - model_name: "free-llama-3.3-70b"
    litellm_params: {model: openrouter/meta-llama/llama-3.3-70b-instruct:free, api_key: "<OPENROUTER_API_KEY>"}
  - model_name: "free-nemotron-120b"
    litellm_params: {model: openrouter/nvidia/nemotron-3-super-120b-a12b:free, api_key: "<OPENROUTER_API_KEY>"}
  - model_name: "free-gemma-4-31b"
    litellm_params: {model: openrouter/google/gemma-4-31b-it:free, api_key: "<OPENROUTER_API_KEY>"}

  # ═══ 逆向 API（fallback，不注册不付费）═══
  - model_name: "reverse-deepseek"
    litellm_params: {model: openai/deepseek-v4-flash, api_base: "http://127.0.0.1:9655/v1", api_key: "dummy"}
  - model_name: "reverse-qwen"
    litellm_params: {model: openai/qwen3.8-max, api_base: "http://127.0.0.1:9666/v1", api_key: "dummy"}
  - model_name: "reverse-mimo"
    litellm_params: {model: openai/mimo-v2-flash, api_base: "http://127.0.0.1:8080/v1", api_key: "dummy"}

  # ═══ 无审查端点（有 key 才生效）═══
  - model_name: "magmarouter-glm-xploded"
    litellm_params: {model: openai/glm-5.3-flash-xploded, api_base: "https://api.magmarouter.com/v1", api_key: "<MAGMAROUTER_API_KEY>"}
  - model_name: "abliteration-glm"
    litellm_params: {model: openai/abliterated-model-large-v2, api_base: "https://api.abliteration.ai/v1", api_key: "<ABLITERATION_API_KEY>"}

  # ═══ HF / 社区 ═══
  - model_name: "hf-serverless"
    litellm_params: {model: huggingface/meta-llama/Llama-3.3-70B-Instruct, api_key: "<HF_TOKEN>"}
  - model_name: "hf-router-featherless"
    litellm_params: {model: openai/huihui-ai/Qwen2.5-72B-Instruct-abliterated, api_base: "https://router.huggingface.co/featherless-ai/v1", api_key: "<HF_TOKEN>"}
  - model_name: "featherless-qwen-abliterated"
    litellm_params: {model: openai/Huihui-Qwen3.5-27B-abliterated, api_base: "https://api.featherless.ai/v1", api_key: "<FEATHERLESS_API_KEY>"}

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120

general_settings:
  master_key: "${LITELLM_MASTER}"

router_settings:
  fallbacks:
    - deepseek-v4-flash: ["free-qwen3.8-27b", "reverse-deepseek"]
    - glm-5.2: ["free-glm-5.2", "glm-4.7"]
    - qwen-plus: ["free-qwen3.8-27b", "reverse-qwen"]
    - free-qwen3.8-27b: ["free-glm-5.2", "free-llama-3.3-70b"]
    - magmarouter-glm-xploded: ["abliteration-glm", "free-glm-5.2"]
