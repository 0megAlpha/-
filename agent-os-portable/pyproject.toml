[project]
name = "xiaye-agent-os"
version = "0.1.0"
description = "Portable, self-hosted multi-agent engineering workspace built around OpenHands and LangGraph"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aider-chat>=0.86",
  "langgraph>=1.0",
  "langchain-openai>=1.0",
  "langchain-community>=0.4",
  "autogen-agentchat>=0.7",
  "autogen-ext[openai]>=0.7",
  "playwright>=1.55",
  "mcp>=1.20",
  "pydantic-settings>=2.10",
  "python-dotenv>=1.1",
]
[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.14", "pip-audit>=2.9"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_os*"]
