<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portals</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background-color: #0f172a; color: #e2e8f0; font-family: sans-serif; }
.card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s; }
.card:hover { background: rgba(51, 65, 85, 0.9); transform: translateY(-2px); }
</style>
</head>
<body class="min-h-screen p-4">
<div class="max-w-4xl mx-auto">
<h1 class="text-2xl font-bold text-cyan-400 mb-2">PORTALS</h1>
<p class="text-sm text-slate-400 mb-6">雲端與桌面 IDE 入口，點擊開啟</p>
<div id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
</div>
<script>
const PORTALS = [
  { name: "Cursor", url: "https://cursor.com", note: "桌面 IDE" },
  { name: "Cursor Web", url: "https://cursor.com/dashboard", note: "網頁版" },
  { name: "Trae", url: "https://www.trae.ai", note: "桌面 IDE" },
  { name: "Windsurf", url: "https://windsurf.com", note: "桌面 IDE" },
  { name: "Void", url: "https://voideditor.com", note: "開源桌面 IDE" },
  { name: "PearAI", url: "https://pearai.io", note: "桌面 IDE" },
  { name: "Bolt.new", url: "https://bolt.new", note: "雲端全棧" },
  { name: "Replit Agent", url: "https://replit.com", note: "雲端 IDE" },
  { name: "OpenAI Operator", url: "https://chatgpt.com", note: "OpenAI 雲端" },
  { name: "GitHub Copilot", url: "https://github.com/features/copilot", note: "雲端助手" },
  { name: "Copilot Workspace", url: "https://githubnext.com/projects/copilot-workspace", note: "Issue 轉 PR" },
  { name: "Continue", url: "https://www.continue.dev", note: "VS Code 擴充" },
  { name: "Warp AI", url: "https://www.warp.dev", note: "桌面終端" },
  { name: "Wave Terminal", url: "https://www.waveterm.dev", note: "桌面終端" },
  { name: "Duckie", url: "https://duckie.ai", note: "Slack 工程師" },
  { name: "AutoDev", url: "https://github.com/unit-mesh/auto-dev", note: "JetBrains" },
  { name: "Claude Design 2.0", url: "https://claude.ai", note: "Claude 雲端" },
  { name: "OpenHands Cloud", url: "https://app.all-hands.dev", note: "官方雲端" },
  { name: "OpenCode Web", url: "https://opencode.ai", note: "官方" },
  { name: "Droidrun", url: "https://github.com/droidrun", note: "Android 自動化" }
];
const grid = document.getElementById("grid");
PORTALS.forEach(function(p) {
  const a = document.createElement("a");
  a.href = p.url;
  a.target = "_blank";
  a.rel = "noreferrer";
  a.className = "card rounded-2xl p-4 block";
  a.innerHTML = '<div class="font-bold text-sm text-cyan-300">' + p.name + '</div>' +
    '<div class="text-xs text-slate-400 mt-1">' + p.note + '</div>' +
    '<div class="text-xs text-slate-500 mt-2 break-all">' + p.url + '</div>';
  grid.appendChild(a);
});
</script>
</body>
</html>
