<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qwen 3.7 Plus Agent Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
.mono { font-family: 'JetBrains Mono', monospace; }
.glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
.glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.3); }
.glow-red { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
.scroll-hide::-webkit-scrollbar { display: none; }
@keyframes pulse-border { 0% { border-color: rgba(56, 189, 248, 0.3); } 50% { border-color: rgba(56, 189, 248, 0.8); } 100% { border-color: rgba(56, 189, 248, 0.3); } }
.active-agent { animation: pulse-border 2s infinite; border: 1px solid #38bdf8; }
</style>
</head>
<body class="min-h-screen flex flex-col">
<div id="app" class="flex-1 flex flex-col max-w-4xl mx-auto w-full p-4">
<header class="flex justify-between items-center mb-6 py-4 px-6 glass rounded-2xl">
<div><h1 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">AGENT COMMAND CENTER</h1>
<p class="text-xs text-slate-400 mono mt-1">VPS: vmi3390662 | Status: <span class="text-green-400">ONLINE</span></p></div>
<div class="text-right"><div class="text-xs text-slate-400">Active Gateway</div><div class="text-sm font-bold text-cyan-400 mono">LiteLLM :4001</div></div>
</header>
<section class="mb-6">
<h2 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">Agent Interlock Selector</h2>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
<button v-for="agent in agents" :key="agent.id" @click="selectAgent(agent)" :class="['p-4 rounded-xl glass transition-all duration-300 flex flex-col items-center justify-center gap-2', currentAgent.id === agent.id ? 'active-agent bg-slate-800' : 'hover:bg-slate-800/50']">
<div :class="['w-3 h-3 rounded-full', agent.status === 'online' ? 'bg-green-500 glow-green' : 'bg-red-500 glow-red']"></div>
<span class="font-bold text-sm">{{ agent.name }}</span>
<span class="text-[10px] text-slate-400 mono">{{ agent.role }}</span>
</button>
</div>
</section>
<section class="mb-6">
<div class="glass rounded-2xl p-1 flex items-center gap-2">
<span class="pl-4 text-cyan-400 mono text-lg">></span>
<input v-model="command" @keyup.enter="executeCommand" type="text" placeholder="輸入指令調度 {{ currentAgent.name }}" class="flex-1 bg-transparent border-none outline-none text-white p-4 text-sm mono placeholder-slate-600">
<button @click="executeCommand" class="bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-3 rounded-xl font-bold text-sm transition-colors">執行</button>
</div>
</section>
<section class="flex-1 flex flex-col min-h-[300px]">
<div class="flex justify-between items-center mb-3">
<h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
<span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
Cline Auto-Debugging Monitor
</h2>
<button @click="clearLogs" class="text-xs text-slate-500 hover:text-white transition-colors">Clear Logs</button>
</div>
<div class="flex-1 glass rounded-2xl p-4 overflow-y-auto scroll-hide mono text-xs md:text-sm relative">
<div v-if="logs.length === 0" class="absolute inset-0 flex items-center justify-center text-slate-600">等待系統事件或崩潰捕獲...</div>
<div v-for="(log, index) in logs" :key="index" :class="['mb-2 p-3 rounded-lg border-l-4', log.type === 'error' ? 'bg-red-900/20 border-red-500 text-red-300' : log.type === 'success' ? 'bg-green-900/20 border-green-500 text-green-300' : 'bg-slate-800/50 border-cyan-500 text-slate-300']">
<div class="flex justify-between mb-1">
<span class="font-bold text-[10px] uppercase opacity-70">{{ log.timestamp }}</span>
<span class="font-bold text-[10px] uppercase">{{ log.source }}</span>
</div>
<div class="break-words">{{ log.message }}</div>
<div v-if="log.type === 'error'" class="mt-3 flex gap-2">
<button @click="healSystem(log)" class="bg-red-600/80 hover:bg-red-500 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1 transition-colors">一鍵下達修復命令</button>
</div>
</div>
</div>
</section>
</div>
<script>
const { createApp, ref, onMounted } = Vue;
createApp({
setup() {
const agents = ref([
{ id: 'openhands', name: 'OpenHands', role: '全端自動化開發', status: 'online' },
{ id: 'devin', name: 'Devin 2.2', role: '自主軟體工程師', status: 'online' },
{ id: 'claude', name: 'Claude Code', role: '上下文微調與重構', status: 'online' },
{ id: 'cline', name: 'Cline', role: '終端機穿透與除錯', status: 'online' }
]);
const currentAgent = ref(agents.value[0]);
const command = ref('');
const logs = ref([]);
const selectAgent = (agent) => {
currentAgent.value = agent;
addLog('info', 'SYSTEM', '已切換調度底座至: ' + agent.name + ' (' + agent.role + ')');
};
const executeCommand = () => {
if (command.value.trim().length === 0) return;
addLog('info', currentAgent.value.name, '接收指令: ' + command.value);
setTimeout(() => {
addLog('success', currentAgent.value.name, '指令執行成功。已透過 LiteLLM 網關路由並返回結果。');
}, 800);
command.value = '';
};
const addLog = (type, source, message) => {
const now = new Date();
const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0') + ':' + now.getSeconds().toString().padStart(2, '0');
logs.value.unshift({ type: type, source: source, message: message, timestamp: timeStr });
if (logs.value.length > 50) logs.value.pop();
};
const healSystem = (log) => {
addLog('info', 'GATEKEEPER', '正在觸發 Cline 自動修復協議...');
setTimeout(() => {
addLog('success', 'CLINE_HEAL', '已執行: docker restart google-ai && systemctl restart openhands.service。系統恢復正常。');
}, 1500);
};
const clearLogs = () => { logs.value = []; };
onMounted(() => {
addLog('info', 'SYSTEM', 'WebUI 管理畫面已就緒。Cline 監控守護進程已掛載 (PID: 1680511)。');
setInterval(() => {
if (Math.random() > 0.8) {
addLog('info', 'LITELLM', '負載均衡輪詢: 路由請求至備用 API Key 節點 (Latency: 42ms)');
}
}, 15000);
});
return { agents, currentAgent, command, logs, selectAgent, executeCommand, healSystem, clearLogs };
}
}).mount('#app');
</script>
</body>
</html>
