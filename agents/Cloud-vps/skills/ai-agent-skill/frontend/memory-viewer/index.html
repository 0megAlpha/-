<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Memory Viewer — Ai-agent-skill</title>
<style>
:root{--bg:#0a0e17;--card:#111827;--border:#1f2937;--text:#d1d5db;--muted:#6b7280;
      --accent:#8b5cf6;--green:#10b981;--yellow:#f59e0b;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",monospace;background:var(--bg);color:var(--text);padding:20px}
header{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:20px}
h1{color:var(--accent);font-size:22px}
.sub{color:var(--muted);font-size:12px;margin-top:6px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:9px 12px;border-radius:8px;font-size:13px;font-family:inherit}
input{min-width:260px;flex:1}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat .v{font-size:20px;margin-top:6px}
.entry{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:8px;padding:14px;margin-bottom:10px}
.entry .meta{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.entry .content{font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;
  border:1px solid var(--border);color:var(--accent)}
.offline{color:var(--yellow)}
.empty{color:var(--muted);font-size:13px;padding:24px;text-align:center}
code{background:#0d1420;padding:1px 5px;border-radius:4px;color:#7dd3fc}
</style>
</head>
<body>
<header>
  <h1>🧠 Engineering Memory Viewer</h1>
  <p class="sub">真實資料來源：Qdrant（<span id="qhost">…</span>）　·
     端點不存在時顯示 offline，<b>不使用任何假資料</b>。</p>
</header>

<div class="bar">
  <input id="q" placeholder="全文關鍵字過濾（前端本地 filter，不需重新查詢）">
  <select id="col">
    <option value="">— 選擇 collection —</option>
  </select>
  <button id="reload">⟳ 重新載入</button>
  <button id="cfg">⚙ 連線設定</button>
</div>

<div class="stats">
  <div class="stat"><div class="k">Qdrant</div><div class="v" id="s-status">…</div></div>
  <div class="stat"><div class="k">Collections</div><div class="v" id="s-cols">0</div></div>
  <div class="stat"><div class="k">Total Points</div><div class="v" id="s-points">0</div></div>
  <div class="stat"><div class="k">顯示筆數</div><div class="v" id="s-shown">0</div></div>
</div>

<div id="list"><div class="empty">載入中…</div></div>

<script src="viewer.js"></script>
</body>
</html>
