# ============================================================
# software-development.yaml — 主力軟體開發流水線
# CEO 目標 → 需求 → 架構 → 編碼 → 審查 → 驗證 → 部署
# 每個 stage 的 agent 由 orchestrator 動態評分覆寫（此處為預設值）
# ============================================================
name: software-development
version: 2
owner: Hermes（AI Manager）

stages:
  - id: requirements
    agent: hermes
    action: clarify_and_plan
    outputs: [tech_spec, task_tree]
    human_gate: true          # 目標模糊時先問 CEO，不猜
    description: >
      把 CEO 的一句話目標轉成 tech_spec + 任務樹。
      若需求存在矛盾或關鍵資訊缺失，必須停下來問，不得自行假設。

  - id: architecture
    agent: claude-code
    action: design_architecture
    inputs: [tech_spec]
    outputs: [architecture_doc, risk_list]
    human_gate: false
    fallback_agent: kilo-code
    description: >
      Workflow Architect 設計工作流；若屬新型/複雜架構才呼叫 Claude，
      一般架構由 kilo-code 處理（成本更低）。

  - id: coding
    agent: openhands
    action: implement
    inputs: [architecture_doc, task_tree]
    outputs: [code, tests]
    fallback_agent: opencode
    description: >
      長時間自主工程用 OpenHands（Docker 沙箱 + Browser）；
      短任務或純 patch 用 OpenCode。

  - id: review
    agent: claude-code
    action: code_review
    inputs: [code]
    outputs: [review_comments]
    checks: [correctness, security, readability, perf]

  - id: verification
    agent: mini-swe-agent
    action: run_tests
    inputs: [code, tests]
    outputs: [test_report]
    required: true            # 不可被演化移除（對應 SESM VERIFY_STAGE）
    on_fail: route_to coding  # 失敗必須回流，絕不往後走

  - id: deployment
    agent: opencode
    action: deploy
    inputs: [code]
    human_gate: true          # 上線一定要 CEO 點頭
    rollback: always

verification_gates:
  tests_pass: true
  coverage: ">= 80%"
  security_scan: clean       # semgrep + gitleaks 無 ERROR
  typecheck: clean

retry_policy:
  max_retries: 3
  backoff: exponential
  escalate_to: Hermes         # 重試耗盡後交回經理重新決策

memory:
  write_back:
    - on: success   # 成功解法寫入 Engineering Memory
      store: [solution, code_pattern]
    - on: failure   # 失敗原因寫入 Failure Memory（避免重蹈覆轍）
      store: [error, root_cause, environment]