version: '3.8'
 
services:
  openhands:
    image: ghcr.io/all-hands-ai/openhands:latest
    container_name: openhands-core
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./openhands/workspace:/opt/workspace
      - ~/.openhands:/root/.openhands
      - ./.env.prod:/root/.env.prod
    environment:
      SANDBOX_USER_ID: "1000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
 
networks:
  default:
    name: agent-factory
