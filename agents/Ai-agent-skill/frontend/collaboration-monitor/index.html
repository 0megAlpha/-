<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Collaboration Monitor</title>
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#c9d1d9; --accent:#58a6ff; --green:#3fb950; --yellow:#db6d28; --red:#f85149; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",monospace; background:var(--bg); color:var(--text); padding:20px; }
h1 { color:var(--accent); font-size:20px; text-align:center; padding:14px; border-bottom:1px solid var(--border); margin-bottom:16px; }
h1 small { display:block; font-size:11px; color:#8b949e; margin-top:6px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
.card h2 { color:var(--accent); font-size:14px; margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:6px; }
input { width:100%; padding:8px; background:#0d1117; border:1px solid var(--border); color:var(--text); border-radius:4px; margin-bottom:6px; }
button { padding:8px 14px; background:var(--accent); color:#fff; border:none; border-radius:4px; cursor:pointer; width:100%; }
table { width:100%; border-collapse:collapse; font-size:13px; }
td, th { padding:6px 8px; border-bottom:1px solid #21262d; text-align:left; }
.on { color:var(--green); } .off { color:var(--red); } .warn { color:var(--yellow); }
.mem { font-size:12px; padding:8px; border:1px dashed #21262d; border-radius:6px; margin-bottom:8px; word-break:break-all; }
.mem .meta { color:#8b949e; font-size:11px; }
.note { font-size:11px; color:#8b949e; }
</style>
</head>
<body>
<h1>🔗 Agent Collaboration Monitor
  <small>Qdrant 向量記憶 × Hermes Manager 真實數據（修復 4）｜端點不存在時如實顯示，不假造</small>
</h1>

<div class="grid">
  <div class="card">
    <h2>⚙️ 連線設定</h2>
    <input id="cfg-hermes" placeholder="Hermes URL（http://100.126.48.60:8642）">
    <input id="cfg-qdrant" placeholder="Qdrant URL（http://100.126.48.60:6333）">
    <input id="cfg-key" type="password" placeholder="API Key（僅存本機 localStorage）">
    <button onclick="saveConfig()">儲存並刷新</button>
    <div class="note">跨網域需 Hermes/Qdrant 開 CORS。</div>
  </div>

  <div class="card">
    <h2>🤖 Agent 協作狀態</h2>
    <table><thead><tr><th>Agent</th><th>狀態</th><th>目前工作</th></tr></thead><tbody id="agent-tbody"></tbody></table>
  </div>

  <div class="card">
    <h2>🧬 記憶庫（Qdrant Collections）</h2>
    <table><thead><tr><th>Collection</th><th>Points</th><th>狀態</th></tr></thead><tbody id="mem-tbody"></tbody></table>
    <div class="note" id="mem-note"></div>
  </div>

  <div class="card">
    <h2>🔍 記憶檢索（最新 20 筆 + 關鍵詞過濾）</h2>
    <input id="mem-filter" placeholder="輸入關鍵詞過濾（如：port、migration、SESM）" oninput="renderMemories()">
    <div id="mem-list" style="max-height:360px;overflow-y:auto;margin-top:8px;"></div>
  </div>
</div>

<script src="monitor.js"></script>
</body>
</html>
