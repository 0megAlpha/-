name: Agent Fleet Verification

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: agent-fleet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without initializing submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Verify repository structure and config syntax
        run: python tools/verify_repo.py
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -path './.git' -prune -o -type f -name '*.sh' -print0)
      - name: Scan current tree for high-confidence credential patterns
        run: python tools/verify_repo.py --secrets-only
